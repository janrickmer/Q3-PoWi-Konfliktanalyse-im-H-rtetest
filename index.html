/* ---------- Rich-Text-Editor: Blöcke, Aufgabenblöcke, Serialisierung ---------- */
const ed=$("editor");
function isBlockEl(node){ return !!(node&&node.nodeType===1&&/^(DIV|P|H[1-6]|LI|BLOCKQUOTE|PRE)$/.test(node.tagName)); }
function isTask(el){ return !!(el&&el.nodeType===1&&el.classList&&el.classList.contains("task")); }
function editorBlocks(){ return Array.prototype.filter.call(ed.childNodes,n=>n.nodeType===1); }
function emptyBlock(){ const d=document.createElement("div"); d.appendChild(document.createElement("br")); return d; }
function blockIsEmpty(b){ return !b || (b.textContent||"").replace(/\u200B/g,"")===""; }
/* Aufgabenblock: nicht editierbar, fett; das „x" (data-noser) wird nie mit serialisiert */
function makeTaskBlock(label,text){
  const div=document.createElement("div");
  div.className="task"; div.setAttribute("contenteditable","false"); div.setAttribute("draggable","false");
  if(label){
    const l=document.createElement("span"); l.className="task-label"; l.textContent=label;
    div.appendChild(l); div.appendChild(document.createElement("br"));
  }
  const t=document.createElement("span"); t.className="task-text"; t.textContent=text; div.appendChild(t);
  const x=document.createElement("button"); x.type="button"; x.className="task-x"; x.tabIndex=-1;
  x.setAttribute("data-noser","1"); x.setAttribute("contenteditable","false");
  x.title="Aufgabentext entfernen"; x.setAttribute("aria-label","Aufgabentext entfernen"); x.textContent="×";
  div.appendChild(x);
  return div;
}
/* Den Block (oberste DIV-Ebene im Editor), in dem ein Knoten liegt. */
function blockOf(node){
  if(!node||node===ed) return null;
  let n=node;
  while(n && n.parentNode!==ed) n=n.parentNode;
  return (n && n.parentNode===ed && n.nodeType===1) ? n : null;
}
/* Block zu einer Selektionsgrenze (Container + Offset); liegt die Grenze direkt im Editor, zählt das Kind an dieser Stelle. */
function blockAt(container,offset){
  if(container===ed){
    const kids=ed.childNodes; if(!kids.length) return null;
    const n=kids[Math.min(offset,kids.length-1)]; return (n&&n.nodeType===1)?n:null;
  }
  return blockOf(container);
}
/* Aufgabenblock, in dem ein Knoten liegt (oder null). */
function taskOf(node){ let n=node; while(n&&n!==ed){ if(isTask(n)) return n; n=n.parentNode; } return null; }

/* Read-only: liest den contenteditable-Inhalt als {text, fmt, blocks} aus, OHNE das DOM
   oder den Cursor zu verändern. Inline-Formatierung ändert den Text nicht, nur fmt –
   dadurch bleiben die Tipp-Tempo-Daten (recs) über Formatierungen hinweg erhalten.
   Jeder Block der obersten Ebene ist eine Zeile bzw. ein Aufgabenblock; Blöcke sind durch "\n" getrennt.
   fmt[i].s = Zeichen gehört zu einem Aufgabenblock (inkl. der Trenner davor/danach).
   blocks = je Block [Art (0 Zeile, 1 Aufgabe), Zeichenzahl, Labellänge] – damit lässt sich der
   Editor aus den Hintergrunddaten einer PDF exakt wiederherstellen (Zwischenstand). */
function serializeEditor(){
  const chars=[]; const fmt=[]; const blocks=[];
  const BASE={b:false,i:false,u:false,h:false,s:false};
  const SYS={b:false,i:false,u:false,h:false,s:true};
  function pushCh(ch,st){ chars.push(ch); fmt.push({b:st.b,i:st.i,u:st.u,h:st.h,s:st.s}); }
  function lastSerializable(p){
    for(let k=p.childNodes.length-1;k>=0;k--){ const c=p.childNodes[k]; if(c.nodeType===1&&c.hasAttribute("data-noser")) continue; return c; }
    return null;
  }
  function placeholderBr(node){ const p=node.parentNode; return !!p && (p===ed||isBlockEl(p)) && lastSerializable(p)===node; }
  function styleOf(el,st){
    const tag=el.tagName;
    const ns={b:st.b,i:st.i,u:st.u,h:st.h,s:st.s};
    if(tag==="B"||tag==="STRONG") ns.b=true;
    if(tag==="I"||tag==="EM") ns.i=true;
    if(tag==="U"||tag==="INS") ns.u=true;
    const sty=el.style||{};
    const fw=sty.fontWeight; if(fw==="bold"||fw==="bolder"||(fw&&parseInt(fw,10)>=600)) ns.b=true;
    const fst=sty.fontStyle; if(fst&&String(fst).indexOf("italic")>=0) ns.i=true;
    const td=(sty.textDecorationLine||sty.textDecoration||""); if(String(td).indexOf("underline")>=0) ns.u=true;
    if(el.classList&&el.classList.contains("heading")){ ns.h=true; ns.b=true; }
    if(/^H[1-6]$/.test(tag)){ ns.h=true; ns.b=true; }
    try{ const cs=getComputedStyle(el); if(cs){ const w=cs.fontWeight; if(w==="bold"||w==="bolder"||(parseInt(w,10)>=600)) ns.b=true; if(String(cs.fontStyle||"").indexOf("italic")>=0) ns.i=true; } }catch(e){}
    if(isTask(el)){ ns.s=true; ns.b=true; ns.h=false; }
    return ns;
  }
  function walk(node,st){
    const kids=node.childNodes||[];
    for(let k=0;k<kids.length;k++){
      const child=kids[k];
      if(child.nodeType===3){ const s=child.nodeValue||""; for(let q=0;q<s.length;q++) pushCh(s[q],st); }   // je UTF-16-Einheit wie t, recs und fmt (ein Emoji = 2 Einheiten)
      else if(child.nodeType===1){
        if(child.hasAttribute("data-noser")) continue;
        if(child.tagName==="BR"){ if(!placeholderBr(child)) pushCh("\n",st); continue; }
        walk(child, styleOf(child,st));
      }
    }
  }
  let cur=null, prevTask=false;
  function beginBlock(kind,taskFlag){
    if(blocks.length>0) pushCh("\n",(taskFlag||prevTask)?SYS:BASE);   // Trenner zwischen Blöcken
    cur={kind,start:chars.length,label:0};
  }
  function endBlock(){ if(cur){ blocks.push([cur.kind,chars.length-cur.start,cur.label]); prevTask=(cur.kind===1); cur=null; } }
  const kids=ed.childNodes;
  for(let k=0;k<kids.length;k++){
    const node=kids[k];
    if(node.nodeType===1&&node.hasAttribute("data-noser")) continue;
    if(node.nodeType===1&&isBlockEl(node)){
      endBlock();
      const task=isTask(node);
      beginBlock(task?1:0,task);
      walk(node, styleOf(node,BASE));
      if(task){ const lab=node.querySelector(":scope > .task-label"); cur.label=lab?(lab.textContent||"").length:0; }
      endBlock();
    } else if(node.nodeType===3||node.nodeType===1){
      // lose Text-/Inline-Knoten auf oberster Ebene (kommen nach normalizeBlocks nicht vor): als Zeile zusammenfassen
      if(!cur) beginBlock(0,false);
      if(node.nodeType===3){ const s=node.nodeValue||""; for(let q=0;q<s.length;q++) pushCh(s[q],BASE); }
      else if(node.tagName==="BR"){ if(!placeholderBr(node)) pushCh("\n",BASE); }
      else walk(node, styleOf(node,BASE));
    }
  }
  endBlock();
  return { text: chars.join(""), fmt, blocks };
}

/* Baut den Editor-Inhalt aus reinem Text neu auf (jede Zeile = ein Block-DIV). */
function setEditorText(plain){
  const root=ed; root.innerHTML="";
  const lines=String(plain||"").split("\n");
  for(const line of lines){
    const div=document.createElement("div");
    if(line==="") div.appendChild(document.createElement("br"));
    else div.appendChild(document.createTextNode(line));
    root.appendChild(div);
  }
  if(root.childNodes.length===0) root.appendChild(emptyBlock());
  updateEmpty();
}
/* Editor mit vorgegebenen Aufgaben füllen: je Aufgabe ein fester Aufgabenblock + eine leere Antwortzeile.
   Der Ausgangszustand ist komplett System-Text (grau gezählt wird nichts, nichts ist farbig). */
function fillEditor(tasks,labelFn){
  const root=ed; root.innerHTML="";
  (tasks||[]).forEach((task,i)=>{
    root.appendChild(makeTaskBlock(labelFn?labelFn(i):"", String(task==null?"":task)));
    root.appendChild(emptyBlock());
  });
  if(!root.firstChild) root.appendChild(emptyBlock());
  const ser=serializeEditor();
  prevValue=ser.text; recs=ser.text.split("").map(()=>({src:"s",t:-1}));
  applySystemFlags(ser.fmt);
  updateEmpty(); updateCharcount();
}

/* ---------- Wiederherstellung eines Zwischenstands aus den Hintergrunddaten einer PDF ---------- */
function fmtFromBits(bits){ return {b:!!(bits&1),i:!!(bits&2),u:!!(bits&4),h:!!(bits&8),s:!!(bits&16)}; }
/* Inline-Inhalt (Text mit Formatierung) in einen Zeilenblock schreiben; "\n" wird zu <br> */
function buildInline(parent,text,fmts){
  let run=null, lastBr=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i]; const f=fmts[i]||{};
    if(ch==="\n"){ parent.appendChild(document.createElement("br")); run=null; lastBr=true; continue; }
    lastBr=false;
    if(!run||run.b!==!!f.b||run.i!==!!f.i||run.u!==!!f.u){
      run={b:!!f.b,i:!!f.i,u:!!f.u,node:document.createTextNode("")};
      let el=parent;
      if(run.b){ const x=document.createElement("b"); el.appendChild(x); el=x; }
      if(run.i){ const x=document.createElement("i"); el.appendChild(x); el=x; }
      if(run.u){ const x=document.createElement("u"); el.appendChild(x); el=x; }
      el.appendChild(run.node);
    }
    run.node.nodeValue+=ch;
  }
  if(lastBr||!parent.firstChild) parent.appendChild(document.createElement("br"));   // Platzhalter-<br>, damit der Umbruch erhalten bleibt
}
/* Blockstruktur k in UTF-16-Einheiten wie t. Dateien bis 29.09.2026 zählten k in Unicode-Zeichen (Codepunkten);
   nach einem Emoji passte k dann nicht mehr zu t – solche Längen werden hier umgerechnet. */
function kInUnits(t,k){
  let sum=0; k.forEach((rec,bi)=>{ sum+=(bi>0?1:0)+Math.max(0,rec[1]|0); });
  if(sum===t.length) return k;
  const out=[]; let i=0;
  const adv=(n)=>{ let j=i; while(n-->0&&j<t.length){ const c=t.charCodeAt(j); j+=(c>=0xD800&&c<=0xDBFF&&j+1<t.length&&(t.charCodeAt(j+1)&0xFC00)===0xDC00)?2:1; } return j; };
  for(let bi=0;bi<k.length;bi++){
    const rec=k[bi]; if(bi>0) i++;
    const e=adv(Math.max(0,rec[1]|0)), le=adv(Math.max(0,rec[2]|0));
    out.push([rec[0]|0,e-i,le-i]); i=e;
  }
  return i===t.length?out:k;
}
/* Editor aus t (Text), f (Format-Bits) und k (Blockstruktur) neu aufbauen */
function rebuildEditorFromPayload(p){
  const t=p.t||"", f=p.f||[], k=Array.isArray(p.k)?p.k:null;
  const fm=i=>fmtFromBits(f[i]||0);
  const root=ed; root.innerHTML="";
  function addLine(content,fmts){
    const div=document.createElement("div");
    const heading=content.length>0&&fmts.every(x=>x.h);
    if(heading){ div.classList.add("heading"); fmts=fmts.map(x=>({b:false,i:x.i,u:x.u})); }
    buildInline(div,content,fmts); root.appendChild(div);
  }
  function addTask(content,labelLen){
    const label=labelLen?content.slice(0,labelLen):"";
    const text=labelLen?content.slice(labelLen+1):content;
    root.appendChild(makeTaskBlock(label,text));
  }
  const ku=(k&&k.length)?kInUnits(t,k):null;
  if(ku&&ku.length){
    let idx=0;
    ku.forEach((rec,bi)=>{
      if(bi>0) idx++;                                            // Trenner "\n"
      const kind=rec[0]|0, n=Math.max(0,rec[1]|0), ll=Math.max(0,rec[2]|0);
      const content=t.slice(idx,idx+n); const fmts=[]; for(let i=idx;i<idx+n;i++) fmts.push(fm(i));
      if(kind===1) addTask(content,ll); else addLine(content,fmts);
      idx+=n;
    });
  } else {
    // ältere Dateien ohne Blockstruktur: Zeilen an "\n" trennen; zusammenhängende Zeilen aus vorgegebenem Text
    // (Aufgaben-Bit bzw. Marke "s"/"q") bilden einen Aufgabenblock
    const m=p.m||[]; const isSys=i=>fm(i).s||!!(m[i]&&(m[i][0]==="s"||m[i][0]==="q"));
    const lines=[]; let start=0;
    for(let i=0;i<=t.length;i++){ if(i===t.length||t[i]==="\n"){ lines.push([start,i]); start=i+1; } }
    let taskBuf=null;
    const flush=()=>{ if(taskBuf){ addTask(t.slice(taskBuf[0],taskBuf[1]),0); taskBuf=null; } };
    for(const [a,b] of lines){
      const isTaskLine=b>a; let allSys=isTaskLine; for(let i=a;i<b&&allSys;i++){ if(!isSys(i)) allSys=false; }
      if(allSys){ if(taskBuf) taskBuf[1]=b; else taskBuf=[a,b]; continue; }
      flush();
      const fmts=[]; for(let i=a;i<b;i++) fmts.push(fm(i));
      addLine(t.slice(a,b),fmts);
    }
    flush();
  }
  normalizeBlocks();
}
/* Zwischenstand fortsetzen: Name, Editor-Inhalt und die gespeicherten Zeitwerte je Zeichen übernehmen */
function resumeFromPayload(p){
  const nm=splitName(p); studentVorname=nm.vn; studentNachname=nm.nn;
  $("who-name").textContent=(studentVorname+" "+studentNachname).trim();
  const e=p.e||null; escapeMode=!!(e&&e.esc); escapeRed=(e&&Array.isArray(e.red))?e.red:[]; escapeCtx=escapeMode?cleanEscapeCtx(e.ctx):null;
  rebuildEditorFromPayload(p);
  const t=p.t||"", m=p.m||[];
  const fromFile=[];
  for(let i=0;i<t.length;i++){
    const mk=(m[i]&&m[i].length)?m[i]:["t",-1]; const src=mk[0];
    if(src==="s"||src==="q") fromFile.push({src:"s",t:-1});
    else fromFile.push({src:(src==="p"?"p":"t"),t:-1,g:(typeof mk[1]==="number")?mk[1]:-1});
  }
  prevValue=t; recs=fromFile;
  const ser=serializeEditor();
  if(ser.text!==t) reconcile(ser.text,"t",-1);   // Struktur nicht exakt rekonstruierbar: Abweichungen ohne Tipp-Info übernehmen
  applySystemFlags(ser.fmt);
  prefilled=escapeMode||(Array.isArray(CFG.prefill)&&CFG.prefill.length>0);
  $("taskhint").classList.toggle("hidden",prefilled);
  renderMoodleHints(); hideDlPanel(); closeTaskForm(); selectTask(null);
  updateEmpty(); updateCharcount();
  show("screen-editor");
  setTimeout(()=>{ focusLastAnswer(); positionTaskBtn(); },50);
}

/* Platzhalter ein-/ausblenden (CSS: #editor.empty::before) */
function updateEmpty(){
  ed.classList.toggle("empty", serializeEditor().text.length===0);
}

/* Struktur absichern: lose Text-/Inline-Knoten auf oberster Ebene werden zu Zeilenblöcken;
   nach jedem Aufgabenblock (und am Ende) steht immer eine editierbare Zeile. */
function normalizeBlocks(){
  const root=ed; let changed=false;
  const sel=window.getSelection(); let sc=null,so=0;
  if(sel&&sel.rangeCount&&root.contains(sel.getRangeAt(0).startContainer)){ const r=sel.getRangeAt(0); sc=r.startContainer; so=r.startOffset; }
  let n=root.firstChild;
  while(n){
    const next=n.nextSibling;
    if(n.nodeType===3||(n.nodeType===1&&!isBlockEl(n))){
      if(n.nodeType===3&&!n.nodeValue){ root.removeChild(n); changed=true; n=next; continue; }
      const div=document.createElement("div"); root.insertBefore(div,n); div.appendChild(n);
      let m=div.nextSibling;
      while(m&&(m.nodeType===3||(m.nodeType===1&&!isBlockEl(m)))){ const mm=m.nextSibling; div.appendChild(m); m=mm; }
      changed=true; n=div.nextSibling; continue;
    }
    n=next;
  }
  Array.prototype.slice.call(root.children).forEach((t)=>{
    if(isTask(t)){ const nx=t.nextElementSibling; if(!nx||isTask(nx)){ root.insertBefore(emptyBlock(),t.nextSibling); changed=true; } }
  });
  if(!root.firstChild){ root.appendChild(emptyBlock()); changed=true; }
  if(changed&&sc&&root.contains(sc)&&sc!==root){
    try{
      const r=document.createRange();
      r.setStart(sc,Math.min(so,(sc.nodeType===3?sc.nodeValue.length:sc.childNodes.length))); r.collapse(true);
      sel.removeAllRanges(); sel.addRange(r);
    }catch(e){}
  }
  return changed;
}

/* Alle (editierbaren) Blöcke, die von der aktuellen Auswahl berührt werden. */
function selectedBlocks(){
  const root=ed; const sel=window.getSelection();
  if(!sel||sel.rangeCount===0) return [];
  const r=sel.getRangeAt(0);
  let a=blockAt(r.startContainer,r.startOffset), b=blockAt(r.endContainer,r.endOffset);
  const blocks=editorBlocks();
  if(!a) a=blocks[0]; if(!b) b=blocks[blocks.length-1];
  if(!a||!b) return [];
  const ia=blocks.indexOf(a), ib=blocks.indexOf(b);
  if(ia<0||ib<0) return [];
  const lo=Math.min(ia,ib), hi=Math.max(ia,ib);
  return blocks.slice(lo,hi+1).filter(x=>!isTask(x));
}
/* Überschrift für die ausgewählten Blöcke umschalten. */
function toggleHeading(){
  const blocks=selectedBlocks(); if(!blocks.length) return;
  const allHead=blocks.every(b=>b.classList.contains("heading"));
  blocks.forEach(b=>{ if(allHead) b.classList.remove("heading"); else b.classList.add("heading"); });
  ed.focus();
  updateFormatButtons();
  positionTaskBtn();
}
/* Button-Zustände an die aktuelle Auswahl/Cursorposition anpassen. */
function updateFormatButtons(){
  const q=(c)=>{ try{ return document.queryCommandState(c); }catch(e){ return false; } };
  $("fb-bold").classList.toggle("active", q("bold"));
  $("fb-italic").classList.toggle("active", q("italic"));
  $("fb-underline").classList.toggle("active", q("underline"));
  const blocks=selectedBlocks();
  const head = blocks.length>0 && blocks.every(b=>b.classList.contains("heading"));
  $("fb-heading").classList.toggle("active", head);
}
/* Inline-Befehl (bold/italic/underline) ausführen; Auswahl bleibt erhalten. */
function execInline(cmd){

/* Cursor an den Anfang bzw. an das Ende eines Blocks setzen. */
function placeCaretAtBlockStart(block){
  if(!block) return;
  const sel=window.getSelection(); const r=document.createRange();
  r.setStart(block,0); r.collapse(true);
  sel.removeAllRanges(); sel.addRange(r);
}
function placeCaretAtBlockEnd(block){
  if(!block) return;
  const sel=window.getSelection(); const r=document.createRange();
  let n=block.lastChild; if(n&&n.nodeType===1&&n.tagName==="BR") n=n.previousSibling;
  while(n&&n.nodeType===1&&n.tagName!=="BR"&&n.lastChild) n=n.lastChild;
  if(n&&n.nodeType===3) r.setStart(n,n.nodeValue.length);
  else if(n&&n.parentNode) r.setStartAfter(n);
  else r.setStart(block,0);
  r.collapse(true); sel.removeAllRanges(); sel.addRange(r);
}
/* Cursor in die erste Antwortzeile (erster editierbarer Block) bzw. ans Ende der letzten setzen. */
function focusFirstAnswer(){
  ed.focus();
  const blocks=editorBlocks();
  const first=blocks.find(b=>!isTask(b))||blocks[0];
  placeCaretAtBlockStart(first);
}
function focusLastAnswer(){
  ed.focus();
  const blocks=editorBlocks(); let last=null;
  for(const b of blocks){ if(!isTask(b)) last=b; }
  placeCaretAtBlockEnd(last||blocks[blocks.length-1]);
}

/* ---------- Aufgabenblöcke schützen: nur über das rote „x" entfernbar, nie per Rücktaste/Entf ---------- */
function rangeTouchesTask(r){
  if(!r) return false;
  if(taskOf(r.startContainer)||taskOf(r.endContainer)) return true;
  let live;
  try{ live=document.createRange(); live.setStart(r.startContainer,r.startOffset); live.setEnd(r.endContainer,r.endOffset); }
  catch(e){ return false; }
  if(live.collapsed) return false;
  const tasks=ed.querySelectorAll(".task");
  for(const t of tasks){ if(live.intersectsNode(t)) return true; }
  return false;
}
function selectionTouchesTask(){
  const sel=window.getSelection();
  return !!(sel&&sel.rangeCount&&rangeTouchesTask(sel.getRangeAt(0)));
}
function caretAtBlockStart(r,blk){ const pre=document.createRange(); pre.setStart(blk,0); pre.setEnd(r.startContainer,r.startOffset); return pre.toString().length===0; }
function caretAtBlockEnd(r,blk){ const post=document.createRange(); post.setStart(r.endContainer,r.endOffset); post.setEnd(blk,blk.childNodes.length); return post.toString().length===0; }

ed.addEventListener("beforeinput",(e)=>{
  let hit=false;
  try{ const trs=(typeof e.getTargetRanges==="function")?e.getTargetRanges():[]; for(const tr of trs){ if(rangeTouchesTask(tr)){ hit=true; break; } } }catch(err){}
  if(!hit && selectionTouchesTask()) hit=true;
  if(hit) e.preventDefault();
});

/* Klick auf einen Aufgabenblock zeigt das rote „x"; Klick auf das „x" entfernt den Block */

function removeTaskBlock(t){
  if(!t||!ed.contains(t)) return;
  const next=t.nextElementSibling, prev=t.previousElementSibling;

  const target=(next&&!isTask(next))?next:((prev&&!isTask(prev))?prev:editorBlocks().find(b=>!isTask(b)));
  ed.focus(); placeCaretAtBlockStart(target); lastCaretBlock=target||null;
  syncTracking("t"); updateCharcount(); updateEmpty(); positionTaskBtn();
}

/* ---------- Button „Neuen Aufgabentext eintragen" (schwebt eine Zeile unter der aktuellen Eingabezeile) ---------- */
const taskBtn=$("taskbtn"), taskForm=$("taskform"), taskInput=$("taskinput");
let taskAnchor=null, taskFormOpen=false, lastCaretBlock=null;

function currentBlock(){
  const sel=window.getSelection(); let b=null;
  if(sel&&sel.rangeCount){ const r=sel.getRangeAt(0); if(ed.contains(r.startContainer)) b=blockAt(r.startContainer,r.startOffset); }
  if(!b && lastCaretBlock && ed.contains(lastCaretBlock)) b=lastCaretBlock;
  if(!b){ const bl=editorBlocks(); b=bl[bl.length-1]||null; }
  return b;
}
function positionTaskBtn(){
  if(!taskBtn) return;

  const top=blk?(blk.offsetTop+blk.offsetHeight+6):(ed.offsetTop+6);

function autoGrow(ta){ ta.style.height="auto"; ta.style.height=Math.max(74,ta.scrollHeight+2)+"px"; }
function openTaskForm(){

function cancelTaskForm(){

/* Bestätigen: Aufgabentext als festen, fetten Block eine Zeile unter der letzten Eingabe einfügen;
   der Cursor springt in die Antwortzeile darunter. */
function confirmTaskForm(){
  const text=taskInput.value.replace(/\r\n?/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
  if(!text){ taskInput.focus(); return; }
  const anchor=(taskAnchor&&ed.contains(taskAnchor))?taskAnchor:currentBlock();
  const block=makeTaskBlock("",text);
  let caretBlock;
  if(anchor && !isTask(anchor) && blockIsEmpty(anchor)){
    ed.insertBefore(block,anchor); caretBlock=anchor;          // leere Eingabezeile wird zur Antwortzeile unter der Aufgabe
  } else if(anchor){
    caretBlock=emptyBlock(); ed.insertBefore(block,anchor.nextSibling); ed.insertBefore(caretBlock,block.nextSibling);
  } else {
    caretBlock=emptyBlock(); ed.appendChild(block); ed.appendChild(caretBlock);
  }
  normalizeBlocks();
  closeTaskForm();
  syncTracking("s"); updateCharcount(); updateEmpty();
  ed.focus(); placeCaretAtBlockStart(caretBlock); lastCaretBlock=caretBlock;
  selectTask(null); positionTaskBtn();
  try{ caretBlock.scrollIntoView({block:"nearest"}); }catch(e){}
}

/* Zwischenstand hochladen und weiterarbeiten. Landet eine PDF im falschen Feld, wird sie so geöffnet, wie sie gemeint ist:
   Eine Überblick-PDF aus dem Escape-Room (nur %ESCAPEDATA) startet hier das Finale, eine Feiditor-PDF (%TRACKDATA) im
   Escape-Room-Feld wird mit den gespeicherten Antworten fortgesetzt. Ohne Escape-Room-Weg (z. B. Lerntagebuch) gibt es
   stattdessen einen Hinweis, wo die Überblick-PDF hingehört. */
/* Kennzeile einer PDF: %TRACKDATA steht im Kopf (vor dem ersten Objekt), %ESCAPEDATA im Kopf oder – bei älteren Überblick-PDFs –
   hinter dem letzten %%EOF. Nur dort wird gesucht (wie im Check), damit Text in der PDF keine Kennzeile vortäuschen kann. */
function pdfMarker(str,name){
  const re=new RegExp("%"+name+" (\\S+)");
  const end=str.search(/\n\d+ 0 obj\b/);
  let m=(end>0?str.slice(0,end+1):"").match(re);
  if(!m&&name==="ESCAPEDATA"){ const k=str.lastIndexOf("%%EOF"); if(k>=0) m=str.slice(k).match(re); }
  return m;
}
async function readResumePdf(file){
  $("resume-err").textContent="";
  let str;
  try{ str=await readAsBinaryStr(file); }
  catch(err){ $("resume-err").textContent="Der Zwischenstand konnte nicht gelesen werden: "+(err.message||"unbekannter Fehler"); return; }
  if(!pdfMarker(str,"TRACKDATA")&&pdfMarker(str,"ESCAPEDATA")){
    if(CFG.showEscapeUpload) startEscapeFromPdfStr(str,"resume-err");
    else $("resume-err").textContent="Das ist die Überblick-PDF aus einem Escape-Room. Lade sie bitte auf https://feiditor.janrickmer.de/ hoch (Auswahl „Ich komme aus einem Escape-Room …“).";
    return;
  }
  await resumeFromPdfStr(str,"resume-err");
}
async function resumeFromPdfStr(str,errId){
  const mm=pdfMarker(str,"TRACKDATA");
  if(!mm){ $(errId).textContent="In dieser PDF wurden keine Feiditor-Daten gefunden. Bitte lade eine Zwischenstand-PDF aus dem Feiditor hoch."; return; }
  try{
    const {payload}=await autoDecrypt(mm[1]);
    escapeOverviewStreams=(payload&&payload.e&&payload.e.esc)?overviewStreamsFrom(str):[];
    resumeFromPayload(payload);
  }catch(err){
    console.warn("Feiditor-PDF nicht lesbar:",err);
    $(errId).textContent="Diese Feiditor-PDF konnte nicht gelesen werden. Lade bitte die unveränderte Datei hoch, die der Feiditor gespeichert hat.";
  }
}

/* ---------- Escape-Room-Modus: Aufgaben vorbefüllt (Autostart aus dem Escape-Room oder aus der Überblick-PDF) ---------- */
/* Steckbrief des Escape-Rooms für die KI-Bewertung im „Check des Feind(t)es“: Fach, Jahrgangsstufe, Thema, Name des
   Escape-Rooms und die dort erarbeiteten Inhalte. Übernommen werden nur Texte mit begrenzter Länge. */
function cleanEscapeCtx(c){
  if(!c||typeof c!=="object") return null;
  const s=(v,max)=>(typeof v==="string")?v.replace(/\s+/g," ").trim().slice(0,max):"";
  const o={id:s(c.id,60),fach:s(c.fach,120),stufe:s(c.stufe,120),thema:s(c.thema,200),raum:s(c.raum,200),
    inhalte:Array.isArray(c.inhalte)?c.inhalte.map(x=>s(x,400)).filter(Boolean).slice(0,12):[]};
  return (o.fach||o.stufe||o.thema||o.raum||o.inhalte.length)?o:null;
}
function startEscapeMode(v,n,tasks,red,ctx){
  studentVorname=(v||"").trim(); studentNachname=(n||"").trim();
  $("who-name").textContent=(studentVorname+" "+studentNachname).trim();
  escapeMode=true; escapeRed=Array.isArray(red)?red:[]; escapeCtx=cleanEscapeCtx(ctx);
  const list=Array.isArray(tasks)?tasks:[];
  prefilled=list.length>0;
  fillEditor(list, i=>"Aufgabe "+(i+1));                         // vorbefüllte Aufgaben = feste Aufgabenblöcke
  $("taskhint").classList.toggle("hidden",prefilled);
  renderMoodleHints(); hideDlPanel(); closeTaskForm(); selectTask(null);
  show("screen-editor");
  setTimeout(()=>{ focusFirstAnswer(); positionTaskBtn(); },50);
}
function startEscapeFromPdfStr(str,errId){
  const mm=pdfMarker(str,"ESCAPEDATA");
  if(!mm){$(errId).textContent="In dieser PDF wurden keine Escape-Room-Daten gefunden. Bitte lade die Überblick-PDF aus dem Escape-Room hoch.";return;}
  let d;
  try{ d=JSON.parse(decodeURIComponent(escape(atob(mm[1])))); if(!d||typeof d!=="object") throw new Error("Format"); }
  catch(e){ $(errId).textContent="Die Escape-Room-Daten konnten nicht gelesen werden."; return; }
  escapeOverviewStreams=overviewStreamsFrom(str);   // Überblicksseiten für die fertige PDF
  startEscapeMode(d.v,d.n,d.t,d.r,d.c);
}
async function readEscapePdf(file){
  $("esc-err").textContent="";
  let str;
  try{ str=await readAsBinaryStr(file); }
  catch(e){ $("esc-err").textContent="Datei konnte nicht gelesen werden."; return; }
  if(pdfMarker(str,"TRACKDATA")){ await resumeFromPdfStr(str,"esc-err"); return; }   // Feiditor-PDF im Escape-Room-Feld: mit den Antworten weiterarbeiten statt leer neu beginnen
  startEscapeFromPdfStr(str,"esc-err");
}

  if(e.clipboardData){
    e.preventDefault();

    catch(err){ justPasted=true; }

    const sel=window.getSelection();
    if(sel&&sel.rangeCount){
      const r=sel.getRangeAt(0);

      if(r.collapsed){
        const blk=blockAt(r.startContainer,r.startOffset);
        if(blk&&!isTask(blk)){
          if(e.key==="Backspace"&&isTask(blk.previousElementSibling)&&caretAtBlockStart(r,blk)){ e.preventDefault(); return; }
          if(e.key==="Delete"&&isTask(blk.nextElementSibling)&&caretAtBlockEnd(r,blk)){ e.preventDefault(); return; }
        }
      }
    }

  // Strg/Cmd+B/I/U: Browser formatiert selbst; danach Button-Status aktualisieren
  if((e.ctrlKey||e.metaKey)&&!e.altKey){
    const k=e.key.toLowerCase();
    if(k==="b"||k==="i"||k==="u"){ setTimeout(()=>{ updateFormatButtons(); updateEmpty(); },0); }
  }
  // Enter in einer Überschrift: neue Zeile soll normal sein
  if(e.key==="Enter"){
    setTimeout(()=>{
      const blocks=selectedBlocks();
      blocks.forEach(b=>{ const txt=(b.textContent||"").replace(/\u200B/g,""); if(b.classList.contains("heading")&&txt==="") b.classList.remove("heading"); });
      updateFormatButtons();
    },0);
  }

/* Export: erzeugt die Text-PDF (mit rotem Moodle-Hinweis); die Tracking-Daten stecken verschlüsselt
   als %TRACKDATA in der PDF und sind über „Zugang für die Lehrkraft → PDF laden + Code" auslesbar.
   interim=true: dieselbe PDF als Zwischenstand („Zwischenstand vom … um … von …"), aus dem sich später
   über die Startseite weiterarbeiten lässt. */
async function exportPdf(interim){
  const btn=interim?$("save-btn"):$("export-btn");
  const ser=syncTracking(justPasted?"p":"t"); justPasted=false;   // Editor und Tracking sicher synchron
  const text=ser.text; const fmt=ser.fmt;
  const name=(studentVorname+" "+studentNachname).trim();
  const old=btn.textContent; btn.disabled=true; btn.textContent="Erzeuge PDF…";
  try{
    const payload=buildPayload(name,ser,studentVorname,studentNachname,!!interim);
    const code=_kf(studentVorname);
    const bundle=await aesEncrypt(JSON.stringify(payload),code);

    const pdfName=interim?interimPdfName():makePdfName();

    // PDF: formatierter Text (Aufgaben fett) + roter Moodle-Hinweis; im Escape-Room zusätzlich die Übersichts-Seiten;
    // Tracking-Daten stecken (verschlüsselt) als %TRACKDATA drin
    const overview=(window.__ESCAPE_DATA__&&window.__ESCAPE_DATA__.overview)||null;
    const pdfStr=buildPdf({name,text,fmt,trackB64:bundle,overview,overviewStreams:escapeOverviewStreams});
    const u8=new Uint8Array(pdfStr.length);
    for(let i=0;i<pdfStr.length;i++)u8[i]=pdfStr.charCodeAt(i)&0xFF;
    // octet-stream im Escape-Room-Modus: erzwingt Speichern statt Anzeigen
    const pdfBlob=new Blob([u8],{type:escapeMode?"application/octet-stream":"application/pdf"});

    // Fallback-Link setzen (bleibt anklickbar, falls der Auto-Download blockiert wird)
    const dlPdf=$("dl-pdf");
    setLink(dlPdf,pdfBlob,pdfName);
    $("dl-panel").classList.remove("hidden");

    // PDF direkt im Klick-Kontext herunterladen
    dlPdf.click();

    btn.textContent=interim?"Zwischenstand gespeichert ✓":"PDF erstellt ✓";
    setTimeout(()=>{ btn.textContent=old; }, 2200);
  }catch(err){ alert("Fehler beim Erzeugen der PDF: "+err.message); btn.textContent=old; }
  finally{ btn.disabled=false; }
}

/* Lehrkraft: PDF laden + Code (Einzelansicht) bzw. mehrere PDFs (Tabellenansicht) */
let teacherBundle=null;
let batchRows=[];        // Zeilen der Tabellenansicht
let batchSelected=null;  // in der Tabelle angeklickte Zeile
const TRACK_RE=/%TRACKDATA (\S+)/;

function readAsBinaryStr(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const u=new Uint8Array(fr.result);let s="";const CH=0x8000;for(let i=0;i<u.length;i+=CH)s+=String.fromCharCode.apply(null,u.subarray(i,i+CH));res(s);};
    fr.onerror=()=>rej(new Error("Datei konnte nicht gelesen werden."));
    fr.readAsArrayBuffer(file);
  });
}
function setCodeFor(text){
  const el=$("code-for"); if(!el) return;
  el.textContent=text?("Einzelansicht für "+text+" – bitte Code eingeben."):"";
  el.classList.toggle("hidden",!text);
}
function resetTeacherView(){
  $("teacher-err").textContent=""; $("result").innerHTML="";
  $("code-area").classList.add("hidden"); $("code-input").value="";
  setCodeFor(""); teacherBundle=null; batchRows=[]; batchSelected=null;
}

/* Einzelansicht: eine PDF, Code wird von der Lehrkraft eingegeben */
async function readPdfFile(file){
  resetTeacherView();
  try{
    const str=await readAsBinaryStr(file);
    const mm=str.match(TRACK_RE);
    if(!mm){$("teacher-err").textContent="In dieser PDF wurden keine Tracking-Daten gefunden.";return;}
    teacherBundle=mm[1];
    $("code-area").classList.remove("hidden");
    setTimeout(()=>$("code-input").focus(),40);
  }catch(err){ $("teacher-err").textContent=err.message||"Datei konnte nicht gelesen werden."; }
}

/* Code automatisch ermitteln: alle plausiblen Buchstabenzahlen des Vornamens durchprobieren
   (AES-GCM schlägt bei falschem Code sauber fehl) */
async function autoDecrypt(bundle){
  for(let n=0;n<=60;n++){
    const code=_kfN(n);
    try{ const json=await aesDecrypt(bundle,code); return {payload:JSON.parse(json),code}; }catch(e){}
  }
  throw new Error("Code konnte nicht ermittelt werden.");
}
function splitName(p){
  let vn=(p.vn||"").trim(), nn=(p.nn||"").trim();
  if(!vn&&!nn){ // ältere PDFs: nur Gesamtname gespeichert -> am ersten Leerzeichen teilen
    const n=(p.n||"").trim(); const i=n.indexOf(" ");
    if(i<0) vn=n; else { vn=n.slice(0,i); nn=n.slice(i+1).trim(); }
  }
  return {vn,nn};
}
function redPercent(p){ return (typeof p.r==="number"&&isFinite(p.r))?p.r:computeStats(p.t||"",p.m||[]).redPct; }

/* Tabellenansicht: mehrere PDFs */
async function readBatch(files){
  resetTeacherView();
  $("result").innerHTML=`<p class="batchsum">Werte ${files.length} PDF-Dateien aus…</p>`;
  const rows=[];
  for(const f of files){
    try{
      const str=await readAsBinaryStr(f);
      const mm=str.match(TRACK_RE);
      if(!mm) throw new Error("keine Tracking-Daten gefunden");
      const {payload}=await autoDecrypt(mm[1]);
      const nm=splitName(payload);
      rows.push({file:f.name,vn:nm.vn,nn:nm.nn,r:redPercent(payload),bundle:mm[1],z:payload.z===1});
    }catch(err){ rows.push({file:f.name,error:err.message||"Fehler"}); }
  }
  batchRows=rows;
  renderBatchTable();
}
function renderBatchTable(){
  const rows=batchRows.slice();
  rows.sort((a,b)=>{
    if(!!a.error!==!!b.error) return a.error?1:-1;            // Fehlerzeilen ans Ende
    if(!a.error && b.r!==a.r) return b.r-a.r;                  // Rot-Anteil absteigend
    const c=(a.nn||"").localeCompare(b.nn||"","de"); if(c) return c;
    return (a.vn||"").localeCompare(b.vn||"","de");
  });
  const ok=rows.filter(r=>!r.error), high=ok.filter(r=>r.r>RED_LIMIT).length, errs=rows.length-ok.length;
  let html=`<p class="batchsum">${rows.length} PDF-Dateien · ${high} über ${RED_LIMIT} %${errs?` · ${errs} nicht lesbar`:""}</p>`;
  html+='<div class="tablewrap"><table class="batch"><thead><tr><th>Vorname</th><th>Nachname</th><th class="pct">Rot-Anteil</th></tr></thead><tbody>';
  rows.forEach(r=>{
    if(r.error){ html+=`<tr class="errrow"><td colspan="3">${esc(r.file)} – ${esc(r.error)}</td></tr>`; return; }
    const hi=r.r>RED_LIMIT;
    html+=`<tr class="clickable" data-idx="${batchRows.indexOf(r)}" title="Einzelansicht öffnen (Code erforderlich)"><td>${esc(r.vn)}</td><td>${esc(r.nn)}${r.z?" (Zwischenstand)":""}</td><td class="pct${hi?" high":""}">${r.r}&nbsp;%</td></tr>`;
  });
  html+='</tbody></table></div>';
  html+='<p class="batchhint">Rot-Anteil = Anteil der rot markierten Zeichen (eingefügt oder ≤ 0,015 s getippt). Klick auf eine Zeile öffnet die Einzelansicht nach Eingabe des Codes.</p>';
  $("result").innerHTML=html;
  $("code-area").classList.add("hidden"); setCodeFor(""); $("teacher-err").textContent="";
  batchSelected=null; teacherBundle=null;
  $("result").querySelectorAll("tr.clickable").forEach(tr=>tr.addEventListener("click",()=>selectBatchRow(parseInt(tr.dataset.idx,10),tr)));
}
function selectBatchRow(idx,tr){
  const row=batchRows[idx]; if(!row||row.error) return;
  batchSelected=row; teacherBundle=row.bundle;
  $("result").querySelectorAll("tr.selected").forEach(x=>x.classList.remove("selected"));
  tr.classList.add("selected");
  setCodeFor((row.vn+" "+row.nn).trim());
  $("teacher-err").textContent="";
  $("code-area").classList.remove("hidden"); $("code-input").value="";
  try{ $("code-area").scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){}
  setTimeout(()=>$("code-input").focus(),40);
}

function handleFiles(list){
  const files=Array.prototype.slice.call(list||[]);
  if(!files.length) return;
  if(files.length===1) readPdfFile(files[0]); else readBatch(files);
}
$("pdf-input").addEventListener("change",e=>{handleFiles(e.target.files); e.target.value="";});
const dropZone=$("teacher-drop");
["dragover","dragenter"].forEach(ev=>dropZone.addEventListener(ev,e=>{e.preventDefault();dropZone.style.borderColor="#8a6a3c";}));
["dragleave","drop"].forEach(ev=>dropZone.addEventListener(ev,e=>{e.preventDefault();dropZone.style.borderColor="";}));
dropZone.addEventListener("drop",e=>{handleFiles(e.dataTransfer.files);});

async function showTeacherResult(){
  const code=$("code-input").value.trim();
  $("teacher-err").textContent="";
  if(!teacherBundle)return;
  try{
    const json=await aesDecrypt(teacherBundle,code);
    const p=JSON.parse(json);
    let html=renderAnalysis(p);
    if(batchSelected) html='<a href="#" class="backlink" id="back-table">← zurück zur Tabelle</a>'+html;
    $("result").innerHTML=html;
    if(batchSelected){
      $("code-area").classList.add("hidden"); setCodeFor("");
      $("back-table").addEventListener("click",e=>{e.preventDefault();renderBatchTable();});
    }
  }catch(err){
    if(!batchSelected) $("result").innerHTML="";   // in der Tabellenansicht bleibt die Tabelle stehen
    $("teacher-err").textContent="Falscher Code.";
  }
}
$("code-btn").addEventListener("click",showTeacherResult);
$("code-input").addEventListener("keydown",e=>{if(e.key==="Enter")showTeacherResult();});

const WIN_ANSI_MAP = {
  'ä': 0xE4, 'ö': 0xF6, 'ü': 0xFC, 'Ä': 0xC4, 'Ö': 0xD6, 'Ü': 0xDC, 'ß': 0xDF,
  '€': 0x80, '‚': 0x82, '„': 0x84, '…': 0x85, '†': 0x86, '‡': 0x87,
  '‰': 0x89, '‹': 0x8B, "\u2018": 0x91, "\u2019": 0x92, '\u201C': 0x93, '\u201D': 0x94,
  '•': 0x95, '–': 0x96, '—': 0x97, '™': 0x99, '›': 0x9B,
  '¡': 0xA1, '«': 0xAB, '»': 0xBB, '·': 0xB7, '×': 0xD7, '°': 0xB0,
  '²': 0xB2, '³': 0xB3, '½': 0xBD, '¼': 0xBC, '¾': 0xBE, '¿': 0xBF,
};
const FALLBACK_MAP = {
  '₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9',
  '⁰':'0','¹':'1','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9',
  '→':'->','←':'<-','↑':'^','↓':'v','✓':'v','✗':'x','✕':'x','★':'*','☆':'*',
  '\u00A0':' ','\u2009':' ','\u200B':'',
};

function encodeWinAnsi(str) {
  const bytes = [];
  for (const ch of str) {
    const code = ch.charCodeAt(0);
    if (code < 128) bytes.push(code);
    else if (WIN_ANSI_MAP[ch] !== undefined) bytes.push(WIN_ANSI_MAP[ch]);
    else if (FALLBACK_MAP[ch] !== undefined) {
      for (const sub of FALLBACK_MAP[ch]) bytes.push(sub.charCodeAt(0) & 0xFF);
    } else if (code <= 255) bytes.push(code);
    else bytes.push(0x3F);
  }
  return bytes;
}

// Helvetica width table (1000 units = 1em). Approximate from AFM.
const HELV_W = (() => {
  const w = new Array(256).fill(500);
  const widths = {
    ' ':278,'!':278,'"':355,'#':556,'$':556,'%':889,'&':667,"'":191,'(':333,')':333,
    '*':389,'+':584,',':278,'-':333,'.':278,'/':278,'0':556,'1':556,'2':556,'3':556,
    '4':556,'5':556,'6':556,'7':556,'8':556,'9':556,':':278,';':278,'<':584,'=':584,
    '>':584,'?':556,'@':1015,'A':667,'B':667,'C':722,'D':722,'E':667,'F':611,'G':778,
    'H':722,'I':278,'J':500,'K':667,'L':556,'M':833,'N':722,'O':778,'P':667,'Q':778,
    'R':722,'S':667,'T':611,'U':722,'V':667,'W':944,'X':667,'Y':667,'Z':611,'[':278,
    '\\':278,']':278,'^':469,'_':556,'`':333,'a':556,'b':556,'c':500,'d':556,'e':556,
    'f':278,'g':556,'h':556,'i':222,'j':222,'k':500,'l':222,'m':833,'n':556,'o':556,
    'p':556,'q':556,'r':333,'s':500,'t':278,'u':556,'v':500,'w':722,'x':500,'y':500,
    'z':500,'{':334,'|':260,'}':334,'~':584,
    'ä':556,'ö':556,'ü':556,'Ä':667,'Ö':778,'Ü':722,'ß':611,
    '€':556,'–':556,'—':1000,'«':556,'»':556,'·':278,'°':400,'•':350,
  };
  for (const k in widths) {
    const code = WIN_ANSI_MAP[k] !== undefined ? WIN_ANSI_MAP[k] : k.charCodeAt(0);
    if (code < 256) w[code] = widths[k];
  }
  return w;
})();
function pdfStringWidth(str, fontSize, isBold) {
  const bytes = encodeWinAnsi(str);
  let total = 0;
  for (const b of bytes) total += (HELV_W[b] || 500) * (isBold ? 1.04 : 1);
  return total * fontSize / 1000;
}

class PdfDoc {
  constructor() {
    this.pages = [];
    this.pageW = 595; this.pageH = 842; // A4 in pt
    this.margin = 56;
    this.cursorY = 0;
    this.currentContent = [];
  }
  startPage() {
    this.cursorY = this.pageH - this.margin;
    this.currentContent = [];
  }
  endPage() {
    this.pages.push({ content: this.currentContent.join('\n') });
  }
  _escapedString(str) {
    const bytes = encodeWinAnsi(str);
    let s = '(';
    for (const b of bytes) {
      if (b === 0x28 || b === 0x29 || b === 0x5C) s += '\\';
      s += String.fromCharCode(b);
    }
    s += ')';
    return s;
  }
  text(str, x, y, fontSize, isBold, color) {
    const fontKey = isBold ? 'F2' : 'F1';
    const c = color || [0, 0, 0];
    const pdfStr = this._escapedString(str);
    let cmd = `${c[0]/255} ${c[1]/255} ${c[2]/255} rg\nBT\n/${fontKey} ${fontSize} Tf\n${x} ${y} Td\n${pdfStr} Tj\nET`;
    this.currentContent.push(cmd);
  }
  rect(x, y, w, h, fill, stroke) {
    let cmd = '';
    if (fill) cmd += `${fill[0]/255} ${fill[1]/255} ${fill[2]/255} rg\n`;
    if (stroke) cmd += `${stroke[0]/255} ${stroke[1]/255} ${stroke[2]/255} RG\n`;
    cmd += `${x} ${y} ${w} ${h} re\n`;
    if (fill && stroke) cmd += 'B';
    else if (fill) cmd += 'f';
    else if (stroke) cmd += 'S';
    this.currentContent.push(cmd);
  }
  line(x1, y1, x2, y2, color, width) {
    const c = color || [0,0,0];
    let cmd = `${c[0]/255} ${c[1]/255} ${c[2]/255} RG\n${width||0.5} w\n${x1} ${y1} m ${x2} ${y2} l S`;
    this.currentContent.push(cmd);
  }
  // beforeLine (optional): wird vor jeder Zeile mit deren y-Position aufgerufen und liefert die
  // tatsächliche Position – so bricht ein langer Absatz bei Bedarf auf die nächste Seite um.
  paragraph(str, x, y, width, fontSize, isBold, color, leading, beforeLine) {
    if (!leading) leading = fontSize * 1.4;
    const words = String(str).split(/\s+/);
    let line = '';
    let curY = y;
    const put = (s) => {
      if (beforeLine) curY = beforeLine(curY);
      this.text(s, x, curY, fontSize, isBold, color);
      curY -= leading;
    };
    for (const word of words) {
      if (!word) continue;
      const test = line ? line + ' ' + word : word;
      if (pdfStringWidth(test, fontSize, isBold) <= width) {
        line = test;
      } else {
        if (line) {
          put(line);
          line = word;
        } else {
          put(word);
        }
      }
    }
    if (line) put(line);
    return curY;
  }
  build(headComment) {
    const objects = [null, null,  // catalog, pages
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
    ];
    const pageIds = [];
    for (const page of this.pages) {
      objects.push(`<< /Length ${page.content.length} >>\nstream\n${page.content}\nendstream`);
      const contentId = objects.length;
      objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.pageW} ${this.pageH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${contentId} 0 R >>`);
      pageIds.push(objects.length);
    }
    objects[1] = `<< /Type /Pages /Kids [${pageIds.map(i => i + ' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
    objects[0] = '<< /Type /Catalog /Pages 2 0 R >>';

    let pdf = '%PDF-1.4\n%\xC4\xC5\xC6\xC7\n' + (headComment ? headComment.replace(/^\n+|\n+$/g, '') + '\n' : '');
    const offsets = [0];
    for (let i = 0; i < objects.length; i++) {
      offsets.push(pdf.length);
      pdf += `${i+1} 0 obj\n${objects[i]}\nendobj\n`;
    }
    const xrefOffset = pdf.length;
    pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
    for (let i = 1; i <= objects.length; i++) pdf += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    pdf += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`;
    return pdf;
  }
  // Kennung als Kommentarzeile direkt nach dem Kopf (wie %TRACKDATA im Feiditor), nicht hinter %%EOF: so bleibt startxref
  // in den letzten Bytes der Datei und PDF-Werkzeuge müssen nichts reparieren.
  toBase64(headComment) { return btoa(this.build(headComment)); }
}

  for (let i = 0; i < 6; i++) {
    y = ensure(y, 60);
    doc.text(ROOM_LABELS[i], M, y, 12.5, true, PRIMARY);
    doc.line(M, y - 4, M + CONTENT_W, y - 4, ACCENT, 0.8);
    y -= 18;

    const attempts = state.attempts[i];
    const m = state.mistakes[i];
    const attemptsLabel = attempts === 1 ? '1 Versuch' : attempts + ' Versuche';

    const hm = state.hintMax[i];
    const hintLabelPdf = hm < 0 ? 'Keine Hinweise genutzt.'
      : (hm >= 3 ? 'Hinweise genutzt bis Stufe 4 (Lösung eingesehen).' : 'Hinweise genutzt bis Stufe ' + (hm + 1) + ' von 4.');

    if (!m || !m.errors || m.errors.length === 0) {
      y = doc.paragraph('Fehlerfrei beim ersten Versuch gelöst. (' + attemptsLabel + ')', M, y, CONTENT_W, 10.5, true, GREEN, 14);
      y = doc.paragraph(hintLabelPdf, M, y, CONTENT_W, 10, false, TEXT_MUTE, 13);
      y -= 8;
      continue;
    }

    y = doc.paragraph('Insgesamt benötigt: ' + attemptsLabel + '. ' + hintLabelPdf + ' Beim ersten Versuch waren folgende Punkte falsch:',
                      M, y, CONTENT_W, 10.5, false, TEXT_MUTE, 14);
    y -= 6;

    for (const err of m.errors) {
      y = ensure(y, 60);
      doc.text('•', M, y, 11, true, RED);
      if (err.kind === 'falsch_einsortiert') {
        y = doc.paragraph('"' + err.item + '"', M + 14, y, CONTENT_W - 14, 10.5, true, TEXT, 13);
        y = doc.paragraph('Du hast einsortiert in: ' + err.wrongAnswer + '   ·   Richtig: ' + err.correctAnswer,
                          M + 14, y, CONTENT_W - 14, 10, false, TEXT_MUTE, 13);
        if (err.explanation) y = doc.paragraph('→ ' + err.explanation, M + 14, y, CONTENT_W - 14, 10, false, TEXT_MUTE, 13);
      } else if (err.kind === 'falsche_eingabe') {
        y = doc.paragraph(err.item, M + 14, y, CONTENT_W - 14, 10.5, true, TEXT, 13);
        y = doc.paragraph('Deine Eingabe: "' + err.wrongAnswer + '"   ·   Richtig: ' + err.correctAnswer,
                          M + 14, y, CONTENT_W - 14, 10, false, TEXT_MUTE, 13);
      } else if (err.kind === 'falsche_wahl') {
        y = doc.paragraph(err.item, M + 14, y, CONTENT_W - 14, 10.5, true, TEXT, 13);
        y = doc.paragraph('Du hast gewählt: ' + err.wrongAnswer, M + 14, y, CONTENT_W - 14, 10, false, RED, 13);
        y = doc.paragraph('Richtig wäre: ' + err.correctAnswer, M + 14, y, CONTENT_W - 14, 10, true, GREEN, 13);
        if (err.explanation) y = doc.paragraph('→ ' + err.explanation, M + 14, y, CONTENT_W - 14, 10, false, TEXT_MUTE, 13);
      } else if (err.kind === 'falsche_zuweisung') {
        y = doc.paragraph(err.item, M + 14, y, CONTENT_W - 14, 10.5, true, TEXT, 13);
        y = doc.paragraph('Du hast zugewiesen: ' + err.wrongAnswer + '   ·   Richtig: ' + err.correctAnswer,
                          M + 14, y, CONTENT_W - 14, 10, false, TEXT_MUTE, 13);
        if (err.explanation) y = doc.paragraph('→ ' + err.explanation, M + 14, y, CONTENT_W - 14, 10, false, TEXT_MUTE, 13);
      }
      y -= 5;
    }
    y -= 10;
  }

  y = ensure(y, 50);
  doc.line(M, y, M + CONTENT_W, y, [200, 200, 200], 0.4);
  y -= 14;
  doc.text('Bestätigungscode für Moodle: ' + state.code, M, y, 10, true, PRIMARY);
  y -= 22;
  doc.text('Copyright Jan-Rickmer Feindt', M, y, 8.5, false, TEXT_MUTE);
  doc.endPage();

  /* ---- Seite 2: Lösungserläuterungen ---- */
  function headerSolutions() {
    doc.startPage();
    doc.rect(0, H - 80, W, 80, PRIMARY);
    doc.text('Lösungserläuterungen', M, H - 40, 17, true, [255, 255, 255]);
    doc.text(PDF_SUBLINE, M, H - 60, 10, false, [207, 227, 216]);
    return H - 80 - 24;
  }
  function ensure2(yy, need) { if (yy - need < 60) { doc.endPage(); return headerSolutions(); } return yy; }

  let y2 = headerSolutions();
  y2 = doc.paragraph(
    'Hier werden die richtigen Lösungen der sechs Rätselräume noch einmal genauer erklärt. ' +
    'Nutze diese Seite, um den Stoff der Sitzung zu vertiefen und nachzuarbeiten.',
    M, y2, CONTENT_W, 10.5, false, TEXT, 14);
  y2 -= 10;

  for (const note of SOLUTION_NOTES) {
    y2 = ensure2(y2, 96);
    doc.text(note.room, M, y2, 12.5, true, PRIMARY);
    doc.line(M, y2 - 4, M + CONTENT_W, y2 - 4, ACCENT, 0.8);
    y2 -= 18;
    y2 = doc.paragraph(note.text, M, y2, CONTENT_W, 10.5, false, TEXT, 14.5, yy => ensure2(yy, 0));   // lange Erläuterungen umbrechen
    y2 -= 14;
  }

  // Vermerk für die Lehrkraft: Wurde eine Zwischenstand-Datei geladen – und wo ging es weiter?
  y2 = ensure2(y2, 60);
  doc.text('Verwendung von Zwischenstand-Dateien', M, y2, 12.5, true, PRIMARY);
  doc.line(M, y2 - 4, M + CONTENT_W, y2 - 4, ACCENT, 0.8);
  y2 -= 18;
  for (const line of saveLogPdfLines()) { y2 = ensure2(y2, 20); y2 = doc.paragraph(line, M, y2, CONTENT_W, 10.5, false, TEXT, 14.5); y2 -= 2; }
  y2 -= 12;

  y2 = ensure2(y2, 30);
  doc.line(M, y2, M + CONTENT_W, y2, [200, 200, 200], 0.4);
  y2 -= 14;
  doc.text('Copyright Jan-Rickmer Feindt', M, y2, 8.5, false, TEXT_MUTE);
  doc.endPage();

  // Versteckte Rekonstruktionsdaten für den Standalone-Feiditor und den Check (Kommentarzeile nach dem PDF-Kopf).
  // Enthält: Vorname, Nachname, die sechs Feiditor-Aufgaben, die beiden roten Feldtexte und den Steckbrief.
  const escData = { v: state.firstName, n: state.lastName, t: REFLECT_TASKS.slice(0, 6), r: RED_FIELDS, c: ROOM_CONTEXT };
  let escB64 = '';
  try { escB64 = btoa(unescape(encodeURIComponent(JSON.stringify(escData)))); } catch (e) { escB64 = ''; }
  const head = escB64 ? ('%ESCAPEDATA ' + escB64) : '';
  return doc.toBase64(head);
}

function fmtDateTime(d) {
  if (!d) d = new Date();
  const date = d.toLocaleDateString('de-DE');
  const time = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  return date + ', ' + time + ' Uhr';
}

window.maskBirth = (el) => {
  let v = el.value.replace(/[^0-9]/g, '').slice(0, 8);
  let out = v;
  if (v.length > 4) out = v.slice(0, 2) + '.' + v.slice(2, 4) + '.' + v.slice(4);
  else if (v.length > 2) out = v.slice(0, 2) + '.' + v.slice(2);
  el.value = out;
};

window.submitName = () => {
  const fn = document.getElementById('firstNameInput').value.trim();
  const ln = document.getElementById('lastNameInput').value.trim();
  const bd = document.getElementById('birthInput').value.trim();
  const err = document.getElementById('nameError');
  function showErr(msg) { err.style.display = 'block'; err.textContent = msg; }
  if (fn.length < 2 || ln.length < 2) {
    showErr('Bitte trage deinen vollen Vor- und Nachnamen ein (jeweils mindestens 2 Zeichen).');
    return;
  }
  const m = bd.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (!m) {
    showErr('Bitte gib dein Geburtsdatum im Format TT.MM.JJJJ ein (z. B. 07.03.2008).');
    return;
  }
  const dd = parseInt(m[1], 10), mm = parseInt(m[2], 10), yyyy = parseInt(m[3], 10);
  const thisYear = new Date().getFullYear();
  if (dd < 1 || dd > 31 || mm < 1 || mm > 12 || yyyy < 1900 || yyyy > thisYear) {
    showErr('Das Geburtsdatum scheint nicht zu stimmen. Bitte prüfe Tag, Monat und Jahr.');
    return;
  }
  state.firstName = fn;
  state.lastName = ln;
  state.birthDate = bd;
  state.code = computeCode(m[1] + m[2] + m[3]);
  renderIntro();
};

/* ---------- Gestufte Hinweise ----------
   Stufe 0–2: Hinweise, die mit jedem Fehlversuch konkreter werden.
   Stufe 3 (nach drei Fehlversuchen): die komplette Lösung. */
const HINT_MAX_LEVEL = 3;

function hintLevel(idx) {
  return Math.min(state.attempts[idx], HINT_MAX_LEVEL);
}
function hintButtonLabel(idx) {
  const lv = hintLevel(idx);
  if (lv >= HINT_MAX_LEVEL) return 'Lösung anzeigen';
  return lv === 0 ? 'Hinweis anzeigen' : `Hinweis anzeigen · Stufe ${lv + 1}`;
}
function hintTitle(idx) {
  const lv = hintLevel(idx);
  if (lv >= HINT_MAX_LEVEL) return 'Lösung · nach drei Fehlversuchen';
  const fails = state.attempts[idx];
  return `Hinweis · Stufe ${lv + 1} von 4` + (fails === 0 ? '' : ` · nach ${fails} Fehlversuch${fails === 1 ? '' : 'en'}`);
}
function hintBodyHTML(idx) {
  const lv = hintLevel(idx);
  if (lv >= HINT_MAX_LEVEL) return SOLUTIONS[idx]();
  return HINTS[idx][lv];
}
function renderHintBox(idx) {
  const label = document.getElementById('hintLabel');
  const body = document.getElementById('hintBody');
  if (!label || !body) return;
  label.textContent = hintTitle(idx);
  body.innerHTML = hintBodyHTML(idx);
  state.hintMax[idx] = Math.max(state.hintMax[idx], hintLevel(idx));
}
window.showHint = (idx) => {
  const h = document.getElementById('hintBox');
  if (!h) return;
  renderHintBox(idx);
  h.classList.add('show');
  h.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};
// Nach einem Fehlversuch: Button-Beschriftung und (falls geöffnet) Inhalt der Hinweisbox aktualisieren.
function refreshHint(idx) {
  const btn = document.getElementById('hintBtn');
  if (btn) btn.textContent = hintButtonLabel(idx);
  const h = document.getElementById('hintBox');
  if (h && h.classList.contains('show')) {
    renderHintBox(idx);
    h.classList.remove('pulse'); void h.offsetWidth; h.classList.add('pulse');
  }
}

function showStatus(type, label, msg) {
  const box = document.getElementById('statusBox');
  if (!box) return;
  box.innerHTML = `<div class="status status-${type} show"><span class="label">${label}</span>${msg}</div>`;
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ============================================================
   GENERISCHE RÄTSELKOMPONENTEN
   (Zuordnung in Felder, Multiple-Choice, Lückentext mit freier
    Eingabe, Fragen mit eindeutiger Antwort, Fall-Zuweisung)
   ============================================================ */

const roomLocked = [false, false, false, false, false, false];

function foldUmlauts(s) {
  return s.replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
}
function normalizeAnswer(s) {
  return String(s || '').trim().toLowerCase()
    .replace(/[„"“”‚‘’']/g, '')
    .replace(/[.!?]+$/g, '')
    .replace(',', '.')
    .replace(/\s+/g, ' ')
    .trim();
}
function answerMatches(rawVal, row) {
  const val = normalizeAnswer(rawVal);
  if (!val) return false;
  const accepts = (row.accepts || [row.answer]).map(a => normalizeAnswer(a));
  if (accepts.includes(val) || accepts.map(foldUmlauts).includes(foldUmlauts(val))) return true;
  if (row.type === 'number') {
    const num = parseFloat(val.replace(',', '.'));
    const target = parseFloat(String(row.answer).replace(',', '.'));
    if (!isNaN(num) && !isNaN(target) && Math.abs(num - target) <= (row.tolerance || 0)) return true;
  }
  return false;
}

/* ---------- Zuordnung in Felder (Bucket-Sort) ---------- */
const bucketState = {};   // key -> { assign: {cardId: bucketId}, selected: cardId|null, roomIdx }

function renderBucketSort(key, puzzle, roomIdx, poolLabel) {
  bucketState[key] = { assign: {}, selected: null, roomIdx };
  const cards = shuffle(puzzle.cards).map(c => `
    <button class="sort-card" id="${key}-card-${c.id}" onclick="selectBucketCard(event, '${key}', '${c.id}')">${c.text}</button>
  `).join('');
  const buckets = puzzle.buckets.map(b => `
    <div class="bucket" id="${key}-bucket-${b.id}" onclick="placeBucketCard('${key}', '${b.id}')">
      <div class="bucket-label">${b.label}</div>
      <div class="bucket-desc">${b.desc}</div>
      <div class="bucket-items" id="${key}-items-${b.id}"></div>
    </div>
  `).join('');
  const cls = puzzle.buckets.length === 3 ? 'bucket-area triple' : 'bucket-area';
  return `
    <div class="cards-pool" id="${key}-pool">
      <div class="cards-pool-label">${poolLabel}</div>
      ${cards}
    </div>
    <div class="${cls}">${buckets}</div>
  `;
}

window.selectBucketCard = (event, key, id) => {
  const st = bucketState[key];
  if (!st || roomLocked[st.roomIdx]) return;
  if (st.assign[id]) {
    // Karte liegt bereits in einem Feld
    if (st.selected) return;                     // Klick soll zum Feld durchreichen
    if (event) event.stopPropagation();
    delete st.assign[id];
    const card = document.getElementById(`${key}-card-${id}`);
    card.classList.remove('placed', 'correct', 'incorrect');
    document.getElementById(`${key}-pool`).appendChild(card);
    return;
  }
  if (event) event.stopPropagation();
  document.querySelectorAll(`#${key}-pool .sort-card.selected`).forEach(c => c.classList.remove('selected'));
  document.getElementById(`${key}-card-${id}`).classList.add('selected');
  st.selected = id;
  document.querySelectorAll(`[id^="${key}-bucket-"]`).forEach(b => b.classList.add('target'));
};

window.placeBucketCard = (key, bucketId) => {
  const st = bucketState[key];
  if (!st || roomLocked[st.roomIdx] || !st.selected) return;
  st.assign[st.selected] = bucketId;
  const card = document.getElementById(`${key}-card-${st.selected}`);
  card.classList.remove('selected');
  card.classList.add('placed');
  document.getElementById(`${key}-items-${bucketId}`).appendChild(card);
  st.selected = null;
  document.querySelectorAll(`[id^="${key}-bucket-"]`).forEach(b => b.classList.remove('target'));
};

function evaluateBuckets(key, puzzle, itemPrefix) {
  const st = bucketState[key];
  const placed = Object.keys(st.assign).length;
  if (placed < puzzle.cards.length) return { complete: false, missing: puzzle.cards.length - placed, errors: [], wrongIds: [] };
  const labels = {};
  puzzle.buckets.forEach(b => labels[b.id] = b.label);
  const errors = [], wrongIds = [];
  puzzle.cards.forEach(c => {
    const card = document.getElementById(`${key}-card-${c.id}`);
    card.classList.remove('correct', 'incorrect');
    if (st.assign[c.id] === c.bucket) {
      card.classList.add('correct');
    } else {
      card.classList.add('incorrect');
      wrongIds.push(c.id);
      errors.push({ kind: 'falsch_einsortiert', item: (itemPrefix || '') + c.text, wrongAnswer: labels[st.assign[c.id]] || '(unbekannt)', correctAnswer: labels[c.bucket], explanation: c.expl });
    }
  });
  return { complete: true, errors, wrongIds };
}

function resetWrongCards(key, wrongIds) {
  const st = bucketState[key];
  wrongIds.forEach(id => {
    delete st.assign[id];
    const card = document.getElementById(`${key}-card-${id}`);
    if (!card) return;
    card.classList.remove('placed', 'correct', 'incorrect');
    document.getElementById(`${key}-pool`).appendChild(card);
  });
}

/* ---------- Multiple-Choice (eine richtige Antwort) ---------- */
const mcState = {};   // mcId -> selected option id

function renderMC(mc, roomIdx) {
  mcState[mc.id] = null;
  mc._roomIdx = roomIdx;
  const opts = shuffle(mc.options).map(o => `
    <button class="mc-option" id="${mc.id}-opt-${o.id}" onclick="selectMC('${mc.id}', '${o.id}')"><span class="radio"></span><span>${o.text}</span></button>

  return `
    <div class="mc-block" id="${mc.id}-block">
      <div class="mc-question">${mc.question}</div>
      <div class="mc-options">${opts}</div>
    </div>
  `;
}

const MC_REGISTRY = {};
function registerMC(mc) { MC_REGISTRY[mc.id] = mc; }

window.selectMC = (mcId, optId) => {
  const mc = MC_REGISTRY[mcId];
  if (!mc || roomLocked[mc._roomIdx]) return;
  mcState[mcId] = optId;
  document.querySelectorAll(`#${mcId}-block .mc-option`).forEach(b => b.classList.remove('selected', 'incorrect'));
  document.getElementById(`${mcId}-opt-${optId}`).classList.add('selected');
};

function evaluateMC(mc) {
  const sel = mcState[mc.id];
  if (!sel) return { answered: false, correct: false, error: null };
  const btn = document.getElementById(`${mc.id}-opt-${sel}`);
  btn.classList.remove('selected');
  if (sel === mc.correct) {
    btn.classList.add('correct');
    return { answered: true, correct: true, error: null };
  }
  btn.classList.add('incorrect');
  const wrongText = mc.options.find(o => o.id === sel).text;
  const rightText = mc.options.find(o => o.id === mc.correct).text;
  return { answered: true, correct: false, error: { kind: 'falsche_wahl', item: mc.question, wrongAnswer: wrongText, correctAnswer: rightText, explanation: mc.explanation } };
}

function resetMC(mc) {
  mcState[mc.id] = null;
  document.querySelectorAll(`#${mc.id}-block .mc-option`).forEach(b => b.classList.remove('selected', 'incorrect'));
}

/* ---------- Lückentext mit freier Eingabe ---------- */
function renderClozeProse(key, puzzle) {
  let html = puzzle.prose;
  puzzle.blanks.forEach(b => {
    html = html.replace('{{' + b.id + '}}',
      `<input type="text" class="cloze-input" id="${key}-${b.id}" placeholder="…" autocomplete="off" spellcheck="false" autocapitalize="off">`);
  });
  return `<div class="card" style="margin-top:4px;"><p class="cloze-prose">${html}</p></div>`;
}

function evaluateClozeProse(key, puzzle, itemPrefix) {
  const errors = [];
  let complete = true, allCorrect = true;
  puzzle.blanks.forEach(b => {
    const inp = document.getElementById(`${key}-${b.id}`);
    inp.classList.remove('correct', 'incorrect');
    if (!normalizeAnswer(inp.value)) { complete = false; return; }
    if (answerMatches(inp.value, b)) {
      inp.classList.add('correct');
    } else {
      inp.classList.add('incorrect');
      allCorrect = false;
      errors.push({ kind: 'falsche_eingabe', item: (itemPrefix || 'Lücke: ') + b.label, wrongAnswer: inp.value, correctAnswer: b.answer });
    }
  });
  return { complete, allCorrect, errors };
}

function lockClozeInputs(key, puzzle) {
  puzzle.blanks.forEach(b => { const el = document.getElementById(`${key}-${b.id}`); if (el) el.disabled = true; });
}

    </div>
  `).join('')}</div>`;
}

function evaluateQRows(key, rows) {

/* ---------- Fall-Zuweisung (Fall -> Funktion per Auswahlfeld) ---------- */
function renderAssign(key, cases, options) {
  const opts = shuffle(options);
  const optHtml = '<option value="">— Dimension wählen —</option>' + opts.map(o => `<option value="${o.id}">${o.label}</option>`).join('');
  return `<div class="assign-list">${shuffle(cases).map(c => `
    <div class="assign-row" id="${key}-row-${c.id}">
      <div class="assign-text">${c.text}</div>
      <select class="assign-select" id="${key}-sel-${c.id}">${optHtml}</select>
    </div>
  `).join('')}</div>`;
}

function evaluateAssign(key, cases, labelMap) {
  const errors = [], wrongIds = [];
  let complete = true;
  cases.forEach(c => {
    const sel = document.getElementById(`${key}-sel-${c.id}`);
    const row = document.getElementById(`${key}-row-${c.id}`);
    row.classList.remove('correct', 'incorrect');
    if (!sel.value) { complete = false; return; }
    if (sel.value === c.answer) {
      row.classList.add('correct');
    } else {
      row.classList.add('incorrect');
      wrongIds.push(c.id);
      errors.push({ kind: 'falsche_zuweisung', item: c.text, wrongAnswer: labelMap[sel.value] || '(unbekannt)', correctAnswer: labelMap[c.answer], explanation: c.expl });
    }
  });
  return { complete, errors, wrongIds };
}

function resetAssign(key, wrongIds) {
  wrongIds.forEach(id => {
    const sel = document.getElementById(`${key}-sel-${id}`);
    const row = document.getElementById(`${key}-row-${id}`);
    if (sel) sel.value = '';
    if (row) row.classList.remove('incorrect');

}
function lockAssign(key, cases) {
  cases.forEach(c => { const el = document.getElementById(`${key}-sel-${c.id}`); if (el) el.disabled = true; });
}

function solBuckets(puzzle) {

    `<p><strong>${b.label}:</strong></p><ul>${puzzle.cards.filter(c => c.bucket === b.id).map(c => `<li>${c.text}</li>`).join('')}</ul>`
  ).join('');
}
function solMC(mc) {
  const right = mc.options.find(o => o.id === mc.correct).text;
  return `<p><em>${mc.question}</em><br>→ <span class="sol">${right}</span></p>`;
}
function solCloze(puzzle) {
  let html = puzzle.prose;
  puzzle.blanks.forEach(b => { html = html.replace('{{' + b.id + '}}', `<span class="sol">${b.answer}</span>`); });

}

const choiceState = {};   // key -> { sel: {rowId: optId}, roomIdx }

function renderChoiceRows(key, rows, options, roomIdx, opts) {

    </div>`).join('')}</div>`;
}
window.pickChoice = (key, rowId, optId) => {
  const st = choiceState[key];
  if (!st || roomLocked[st.roomIdx]) return;
  st.sel[rowId] = optId;
  document.querySelectorAll(`[id^="${key}-btn-${rowId}-"]`).forEach(b => b.classList.remove('active'));

  if (btn) btn.classList.add('active');
  const row = document.getElementById(`${key}-row-${rowId}`);
  if (row) row.classList.remove('incorrect');
};
function evaluateChoiceRows(key, rows, options, itemPrefix) {
  const st = choiceState[key];
  const labels = {}; options.forEach(o => labels[o.id] = o.label);
  const errors = [], wrongIds = [];
  let complete = true;
  rows.forEach(r => {
    const row = document.getElementById(`${key}-row-${r.id}`);
    row.classList.remove('correct', 'incorrect');
    const sel = st.sel[r.id];
    if (!sel) { complete = false; return; }
    if (sel === r.answer) row.classList.add('correct');
    else {
      row.classList.add('incorrect'); wrongIds.push(r.id);
      errors.push({ kind: 'falsche_zuweisung', item: (itemPrefix || '') + r.text, wrongAnswer: labels[sel] || '(unbekannt)', correctAnswer: labels[r.answer], explanation: r.expl });
    }
  });
  return { complete, errors, wrongIds };
}
function resetChoiceRows(key, wrongIds) {
  const st = choiceState[key];
  wrongIds.forEach(id => {
    delete st.sel[id];
    const row = document.getElementById(`${key}-row-${id}`);
    if (row) row.classList.remove('incorrect');

  });
}

}

const gridState = {};   // key -> { art: {itemId: artId}, ebene: {itemId: ebeneId}, roomIdx }

function renderGridAssign(key, puzzle, roomIdx) {
  gridState[key] = { art: {}, ebene: {}, roomIdx };
  return `<div class="grid-list">${shuffle(puzzle.items).map(it => `
    <div class="grid-item" id="${key}-item-${it.id}">

    </div>`).join('')}</div>`;
}
window.pickGrid = (key, itemId, dim, optId) => {
  const st = gridState[key];
  if (!st || roomLocked[st.roomIdx]) return;
  st[dim][itemId] = optId;
  document.querySelectorAll(`[id^="${key}-${dim}-${itemId}-"]`).forEach(b => b.classList.remove('active'));
  const btn = document.getElementById(`${key}-${dim}-${itemId}-${optId}`);
  if (btn) btn.classList.add('active');
  const el = document.getElementById(`${key}-item-${itemId}`);
  if (el) el.classList.remove('incorrect');
};
function evaluateGrid(key, puzzle) {
  const st = gridState[key];
  const artL = {}, ebL = {};
  puzzle.arten.forEach(a => artL[a.id] = a.label); puzzle.ebenen.forEach(e => ebL[e.id] = e.label);
  const errors = [], wrongIds = [];
  let complete = true;
  puzzle.items.forEach(it => {
    const el = document.getElementById(`${key}-item-${it.id}`);
    el.classList.remove('correct', 'incorrect');
    const a = st.art[it.id], e = st.ebene[it.id];
    if (!a || !e) { complete = false; return; }
    if (a === it.art && e === it.ebene) el.classList.add('correct');
    else {
      el.classList.add('incorrect'); wrongIds.push(it.id);
      errors.push({ kind: 'falsche_zuweisung', item: 'Folge: ' + it.text, wrongAnswer: artL[a] + ' × ' + ebL[e], correctAnswer: artL[it.art] + ' × ' + ebL[it.ebene], explanation: it.expl });
    }
  });
  return { complete, errors, wrongIds };
}
function resetGrid(key, wrongIds) {
  const st = gridState[key];
  wrongIds.forEach(id => {
    delete st.art[id]; delete st.ebene[id];
    const el = document.getElementById(`${key}-item-${id}`);
    if (el) el.classList.remove('incorrect');
    document.querySelectorAll(`[id^="${key}-art-${id}-"], [id^="${key}-ebene-${id}-"]`).forEach(b => b.classList.remove('active'));
  });
}
function lockGrid(key) {
  document.querySelectorAll(`[id^="${key}-art-"], [id^="${key}-ebene-"]`).forEach(b => b.disabled = true);
}

function renderRoom1() {

window.checkR1 = () => {
  if (roomLocked[0]) return;
  const a = evaluateAssign('r1', PUZZLE_R1.cases, DIM_LABEL);
  if (!a.complete) { showStatus('warning', 'Noch nicht fertig', 'Teil 1: Bitte weise jeder der sechs Aussagen eine Dimension zu.'); return; }

  const errors = [...a.errors, ...c.errors];
  recordAttempt(0, { errors });
  if (errors.length === 0) {
    roomLocked[0] = true;
    lockAssign('r1', PUZZLE_R1.cases); lockClozeInputs('r1c', PUZZLE_R1);
    showStatus('success', 'Sektion 1 freigegeben', 'Das Werkzeug sitzt. Das erste Segment des Siegels rastet ein.');
    setTimeout(() => triggerReveal(0), 900);
  } else {
    showStatus('warning', 'Noch nicht alles stimmt', 'Rot markierte Zuweisungen werden gleich zurückgesetzt; rot markierte Lücken kannst du direkt korrigieren. Lies bei Bedarf den Hinweis und versuche es erneut.');
    refreshHint(0);
    setTimeout(() => resetAssign('r1', a.wrongIds), 3500);
  }
};

    ${renderQRows('r6q', PUZZLE_R6.rows)}
    ${partHead('Teil 3', 'Perspektive')}
    ${renderMC(PUZZLE_R6.mc1, 5)}
    ${roomFooter(room, 'checkR6()')}
  `;
}

window.checkR6 = () => {
  if (roomLocked[5]) return;
  const g = evaluateGrid('r6g', PUZZLE_R6);
  if (!g.complete) { showStatus('warning', 'Noch nicht fertig', 'Teil 1: Bitte wähle zu jeder Folge Art und Ebene.'); return; }
  const q = evaluateQRows('r6q', PUZZLE_R6.rows);
  if (!q.complete) { showStatus('warning', 'Noch nicht fertig', 'Teil 2: Bitte trage Stufe und Konfliktart ein.'); return; }
  const m = evaluateMC(PUZZLE_R6.mc1);
  if (!m.answered) { showStatus('warning', 'Noch nicht fertig', 'Teil 3: Bitte wähle die belegte Perspektive.'); return; }
  const errors = [...g.errors, ...q.errors]; if (m.error) errors.push(m.error);
  recordAttempt(5, { errors });
  if (errors.length === 0) {
    roomLocked[5] = true;
    lockGrid('r6g'); lockQRows('r6q', PUZZLE_R6.rows);
    showStatus('success', 'Sektion 6 freigegeben', 'Das Raster ist vollständig, die Perspektive belegt. Das letzte Segment rastet ein.');
    setTimeout(() => triggerReveal(5), 900);
  } else {
    showStatus('warning', 'Noch nicht alles stimmt', 'Rot markierte Folgen und Antworten werden gleich zurückgesetzt; rot markierte Felder kannst du direkt korrigieren.');
    refreshHint(5);
    setTimeout(() => { resetGrid('r6g', g.wrongIds); if (m.error) resetMC(PUZZLE_R6.mc1); }, 3500);
  }
};

function triggerReveal(roomIdx) {
  state.solved[roomIdx] = true;
  state.letters[roomIdx] = CODE_WORD[roomIdx];

  const overlay = document.getElementById('revealOverlay');
  document.getElementById('revealLetter').textContent = CODE_WORD[roomIdx];
  document.getElementById('revealCaption').textContent = `Segment ${roomIdx + 1} von 6 des Siegels freigeschaltet`;

  const progBox = document.getElementById('revealProgress');
  progBox.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const span = document.createElement('span');
    span.className = 'reveal-progress-letter' + (state.solved[i] ? ' lit' : '');
    span.textContent = state.solved[i] ? CODE_WORD[i] : '·';
    progBox.appendChild(span);
  }

  const btn = document.getElementById('revealContinue');
  const isLast = roomIdx === 5;
  btn.textContent = isLast ? 'Siegel prüfen' : 'Nächste Sektion öffnen';
  btn.onclick = () => {
    overlay.classList.remove('show');
    setTimeout(() => {
      if (isLast) renderFinal();
      else goLibrary(roomIdx + 2);
    }, 300);
  };
  overlay.classList.add('show');
}

/* ============================================================
   DOWNLOAD-HELFER
   ============================================================ */
function translit(s) {
  return (s || '').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
    .replace(/Ä/g, 'Ae').replace(/Ö/g, 'Oe').replace(/Ü/g, 'Ue').replace(/ß/g, 'ss')
    .replace(/[^a-zA-Z0-9-]/g, '');
}
function downloadPdfBase64(b64, filename) {
  const binary = atob(b64); const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a'); link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 1200);
}

        solutionNotes: SOLUTION_NOTES,
        subtitle:      PDF_SUBLINE,
        resumeNotes:   saveLogPdfLines()
      }
    };
    const inject = '<script>window.__ESCAPE_DATA__=' + JSON.stringify(data).replace(/</g, '\\u003c') + ';<\/script>';
    // Direkt nach dem öffnenden <head> einfügen (erstes Vorkommen = echter Dokument-Head;
    // ein </head> käme auch in JS-Strings des Feiditors vor und wäre kein sicherer Anker)
    if (html.indexOf('<head>') !== -1) html = html.replace('<head>', '<head>\n' + inject);
    else html = inject + html;
    // Per document.write öffnen, damit der sichere Kontext (crypto.subtle) erhalten bleibt.
    // Ein Blob-URL würde den secure context verlieren -> Verschlüsselung schlägt fehl.
    // window.open steht synchron im Klick-Handler (kein await davor).
    const win = window.open('', '_blank');
    if (!win) { alert('Bitte erlaube Pop-ups für diese Seite, damit sich die Arena (der Feiditor) öffnen kann.'); return; }
    win.document.open();
    win.document.write(html);
    win.document.close();
  } catch (e) { console.error(e); alert('Die Arena (der Feiditor) konnte nicht geöffnet werden: ' + e.message); }
};

window.downloadOverviewPDF = () => {
  try {
    const b64 = generateMistakesPdf();
    const clean = (s) => (s || '').trim().replace(/\s+/g, '-').replace(/[\/\\:*?"<>|]+/g, '');
    const vn = clean(state.firstName) || 'Vorname';
    const nn = clean(state.lastName) || 'Nachname';
    const filename = `Escape-Room-Überblick_von_${vn}_${nn}.pdf`;
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    // Als generischer Binärstrom (octet-stream) statt application/pdf: So kann kein Browser die Datei
    // inline anzeigen – auch Firefox/Chrome mit „PDF im Browser öffnen" müssen sie speichern. Der Name
    // (.pdf) kommt über das download-Attribut; die Datei selbst ist eine ganz normale PDF.
    const blob = new Blob([bytes], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = filename; link.rel = 'noopener'; link.style.display = 'none';
    document.body.appendChild(link);
    link.click();   // synchron im Klick-Handler -> gilt als vom Nutzer ausgelöst; kein window.open, kein neuer Tab
    // Link und Object-URL erst verzögert entfernen: manche Browser brechen den Download sonst ab
    setTimeout(() => { try { document.body.removeChild(link); } catch (e) {} URL.revokeObjectURL(url); }, 5000);
  } catch (e) {
    console.error('Overview PDF generation failed:', e);
    alert('Konnte die Datei „Escape-Room-Überblick" nicht erzeugen: ' + e.message);
  }
};

const SAVE_GAME_TITLE   = 'Konfliktanalyse im Härtetest';          // Spieltitel (Dateiname & Kopf der Datei)
const SAVE_ROOM_ID      = 'powi-q3-konfliktanalyse-haertetest';    // Kennung: Dateien anderer Escape-Rooms werden abgelehnt
const SAVE_CONTAINER_ID = 'screenContainer';                       // Container, dessen Inhalt jeder Bildschirm ersetzt
const SAVE_ROOMS        = 6;                                       // Anzahl der Sektionen (je Bibliotheks- und Rätselraum)
// Speichern nur in Bibliotheks- und Rätselräumen ab Nr. 2
function saveScreenAllowed(s){ const m=/^(lib|room)(\d+)$/.exec(s||''); return !!m && +m[2]>=2 && +m[2]<=SAVE_ROOMS; }
function saveScreenLabel(s){
  const m=/^(lib|room)(\d+)$/.exec(s||'');
  if(m) return (m[1]==='lib'?'Bibliotheksraum ':'Rätselraum ')+m[2];
  return s==='final'?'Abschlussseite':'Einführung';
}
// Gelöst ist ein Rätselraum schon, sobald er gesperrt ist (roomLocked) – auch in den 0,9 s bis zur Enthüllung.
function saveRoomDone(i){ return !!(state.solved[i] || roomLocked[i]); }
// Ein bereits gelöster Rätselraum wird nicht erneut gezeigt: weiter wie nach dem Enthüllungs-Dialog.
function saveResumeTarget(s){
  const m=/^room(\d+)$/.exec(s||'');
  if(m && saveRoomDone(+m[1]-1)) return +m[1]>=SAVE_ROOMS ? 'final' : 'lib'+(+m[1]+1);
  return s;
}
function saveGoTo(s){
  let m;
  if(s==='final') renderFinal();
  else if((m=/^lib(\d+)$/.exec(s)) && +m[1]>=1 && +m[1]<=SAVE_ROOMS) goLibrary(+m[1]);
  else if((m=/^room(\d+)$/.exec(s)) && +m[1]>=1 && +m[1]<=SAVE_ROOMS){ goRoom(+m[1]); saveRestoreInputs(s); }
  else renderIntro();
  saveInputs=null;
}
// Zusatzdaten außerhalb von state:
//  locked – Sperre der gelösten Rätselräume (roomLocked),
//  inputs – im aktuellen Rätselraum schon eingetragene Antworten, die noch nicht geprüft sind
//           bzw. beim letzten Prüfen stehen bleiben (Felder, Auswahllisten, Wahl-Buttons, Karten).
//           Rot markierte Auswahlen, die das Spiel ohnehin zurücksetzt, werden nicht übernommen.
let saveInputs=null;   // beim Laden gemerkt, nach dem Zeichnen des Rätselraums wieder eingesetzt
function saveCollectExtra(){
  const extra={ locked:roomLocked.slice() };
  const m=/^room(\d+)$/.exec(state.screen||'');
  if(!m || saveResumeTarget(state.screen)!==state.screen) return extra;
  const n=+m[1]-1, byId=id=>document.getElementById(id), wrong=id=>{ const el=byId(id); return !!(el&&el.classList.contains('incorrect')); };
  const own=obj=>Object.keys(obj).filter(k=>obj[k]&&obj[k].roomIdx===n);
  const inputs={ screen:state.screen, fields:{}, mc:{}, choice:{}, grid:{}, bucket:{} };
  document.querySelectorAll('#'+SAVE_CONTAINER_ID+' input.cloze-input[id], #'+SAVE_CONTAINER_ID+' select.assign-select[id]').forEach(el=>{
    if(el.value && !(el.tagName==='SELECT' && el.closest('.incorrect'))) inputs.fields[el.id]=el.value;
  });
  Object.keys(mcState).forEach(id=>{ const opt=mcState[id]; if(opt && MC_REGISTRY[id] && MC_REGISTRY[id]._roomIdx===n && !wrong(id+'-opt-'+opt)) inputs.mc[id]=opt; });
  own(choiceState).forEach(k=>{ const sel={}; Object.keys(choiceState[k].sel).forEach(r=>{ if(!wrong(k+'-row-'+r)) sel[r]=choiceState[k].sel[r]; }); inputs.choice[k]=sel; });
  own(gridState).forEach(k=>{ const g={ art:{}, ebene:{} }; ['art','ebene'].forEach(d=>Object.keys(gridState[k][d]).forEach(it=>{ if(!wrong(k+'-item-'+it)) g[d][it]=gridState[k][d][it]; })); inputs.grid[k]=g; });
  own(bucketState).forEach(k=>{ const a={}; Object.keys(bucketState[k].assign).forEach(c=>{ if(!wrong(k+'-card-'+c)) a[c]=bucketState[k].assign[c]; }); inputs.bucket[k]=a; });
  extra.inputs=inputs;
  return extra;
}
function saveApplyExtra(extra,data){
  const locked=Array.isArray(extra.locked)?extra.locked:[];
  for(let i=0;i<SAVE_ROOMS;i++){
    roomLocked[i]=!!(state.solved[i] || locked[i]===true);
    if(roomLocked[i]){ state.solved[i]=true; state.letters[i]=CODE_WORD[i]; }   // wie triggerReveal
  }
  saveInputs=(extra.inputs && typeof extra.inputs==='object' && extra.inputs.screen===data.screen) ? extra.inputs : null;
}
// Eingaben über dieselben Funktionen wieder einsetzen, die auch ein Klick auslöst
function saveRestoreInputs(s){
  const inp=saveInputs; saveInputs=null;
  if(!inp || inp.screen!==s) return;
  const byId=id=>document.getElementById(id), each=(o,fn)=>{ if(o&&typeof o==='object') Object.keys(o).forEach(k=>fn(k,o[k])); };
  each(inp.fields,(id,v)=>{ const el=byId(id); if(el && typeof v==='string' && el.matches('input.cloze-input, select.assign-select')) el.value=v; });
  each(inp.mc,(id,opt)=>{ if(MC_REGISTRY[id] && byId(id+'-opt-'+opt)) selectMC(id,opt); });
  each(inp.choice,(k,sel)=>{ if(choiceState[k]) each(sel,(r,opt)=>{ if(byId(k+'-btn-'+r+'-'+opt)) pickChoice(k,r,opt); }); });
  each(inp.grid,(k,g)=>{ if(gridState[k]&&g) ['art','ebene'].forEach(d=>each(g[d],(it,opt)=>{ if(byId(k+'-'+d+'-'+it+'-'+opt)) pickGrid(k,it,d,opt); })); });
  each(inp.bucket,(k,a)=>{ if(bucketState[k]) each(a,(c,b)=>{ if(byId(k+'-card-'+c) && byId(k+'-bucket-'+b)){ selectBucketCard(null,k,c); placeBucketCard(k,b); } }); });
}
